# v3_loraB (15 Nov, run_log C10): v3.yaml with the option B adapter on tool 2 (vlm_table) only. Option B = the shard-7
# adapter (Mac checkpoint at step 385) trained further on 630 reports no other adapter used (Kaggle, fresh learning-rate
# plan): about 6,400 charts in one adapter. It has the lowest validation loss of every adapter (0.231 on val_200, against
# 0.244 for the average of seven), so C10 uses it instead of the average (decided 15 Nov on validation loss, not test).
# vlm_crop, the legend reader and the parser keep the base model. Own calibration table (the tool changed).
# Keep rule (written before results): keep only if, pooled over the six splits, no worse than v3 on coverage (79.6%),
# wrong flags (15) and missed errors (4), and better on at least one.
generator:
  reports: {calib: 12, dev: 0, test: 20, style_shift: 0, v3feat: 0}
decision:
  min_group_size: 30
calibration:
  splits: [calib, calib_easy]
models:
  lora_adapter: checkpoints/lora_chart2table_B
tools:
  enabled: [ocr_pixel, deplot, vlm_table, vlm_crop]
retrieval:
  cited_first: true         # G2
  equivalent_metrics: true  # B9: an error-rate claim may be checked on an accuracy chart (as 100 - accuracy)
  aliases:                  # B9: used only when no figure shows the name as written but one shows the alias
    RN18: ResNet-18
    RN-18: ResNet-18
    RN50: ResNet-50
    RN-50: ResNet-50
    ViT-Small: ViT-S
    EffNet: EfficientNet
    VGG16: VGG-16
    BERT: BERT-base
claims:
  ranges: true              # A6
  split_multi: true         # B2
  extremum: true            # B3
  unit_convert: true        # A5
  log_values: true          # B4
ingest:
  two_column: true          # A7
  vector_figures: true      # B1
  split_panels: true        # B5
  detect_kinds: true        # B7
  ocr_scanned: true         # C5
  axis_modes: [linear, log, inverted]   # B4
agent:
  policy: informed
  fixed_order: [ocr_pixel, deplot, vlm_table, vlm_crop]
  hand_off_rejected: true   # G1
  check_captions: true      # A4
  hand_off_unsupported: true  # B7
  cross_chart: true         # B9
paths:
  data_dir: data/local/generated
  splits_dir: data/local/splits
  cache_db: cache/local.sqlite
  calibration_dir: calibration_tables/local_loraB
  runs_dir: runs/v3_loraB
