# v3_q8b (14 Nov, run_log I4/I5): v3.yaml with Qwen3-VL-8B-Instruct in place of the 4B for vlm_table and vlm_crop.
# Own calibration and run folders, so v3's tables and runs are untouched. Readings are cached under the model name.
# v3 (13 Nov): v2 plus the switches of groups A, B and C from the questions.txt review (results/run_log.md, section H).
# Each switch was kept or rejected by the rule written in section H before its replay. Every split had been seen by
# then, so v3 results are development results; the frozen numbers of the report stay those of local_real.yaml.
# Outcome (13 Nov): every switch below was kept. Not part of v3: C3 planner margins (H20, rejected; its own config is
# c3_planner.yaml), B8 table-at-x (H16), C1 hidden bars (H18) and C2 tick agreement (H19), all NO-GO before building.
generator:
  reports: {calib: 12, dev: 0, test: 20, style_shift: 0, v3feat: 0}
decision:
  min_group_size: 30
calibration:
  splits: [calib, calib_easy]
tools:
  enabled: [ocr_pixel, deplot, vlm_table, vlm_crop]
models:
  vlm: Qwen/Qwen3-VL-8B-Instruct
  dtype: bfloat16           # its stored type: converting 17.5 GB to float16 on load stalled the Mac (I4 first try)
retrieval:
  cited_first: true         # G2
  equivalent_metrics: true  # B9: an error-rate claim may be checked on an accuracy chart (as 100 - accuracy)
  aliases:                  # B9: used only when no figure shows the name as written but one shows the alias
    RN18: ResNet-18
    RN-18: ResNet-18
    RN50: ResNet-50
    RN-50: ResNet-50
    ViT-Small: ViT-S
    EffNet: EfficientNet
    VGG16: VGG-16
    BERT: BERT-base
claims:
  ranges: true              # A6
  split_multi: true         # B2
  extremum: true            # B3
  unit_convert: true        # A5
  log_values: true          # B4
ingest:
  two_column: true          # A7
  vector_figures: true      # B1
  split_panels: true        # B5
  detect_kinds: true        # B7
  ocr_scanned: true         # C5
  axis_modes: [linear, log, inverted]   # B4
agent:
  policy: informed
  fixed_order: [ocr_pixel, deplot, vlm_table, vlm_crop]
  hand_off_rejected: true   # G1
  check_captions: true      # A4
  hand_off_unsupported: true  # B7
  cross_chart: true         # B9
paths:
  data_dir: data/local/generated
  splits_dir: data/local/splits
  cache_db: cache/local.sqlite
  calibration_dir: calibration_tables/local_q8b
  runs_dir: runs/v3_q8b
