# Defaults (implementation.md §19). Experiment configs in configs/exp/ override these.

seed: 0

paths:
  data_dir: data/generated
  cache_db: cache/readings.sqlite
  calibration_dir: calibration_tables
  runs_dir: runs

generator:
  reports: {calib: 60, dev: 30, test: 150, style_shift: 30}
  figures_per_report: [2, 4]
  claims_per_figure: [2, 4]
  planted_deltas: [0.02, 0.05, 0.10, 0.20, 0.50]   # fraction of axis range (D1)
  hard_share: 0.5                                   # share of charts in the "hard" style (small, compressed, busy)
  injection_rate: 0.15                              # share of reports with hidden instructions
  clean_twins: true                                 # E8: also build each injected report without the injection

decision:
  level_flag: 0.95        # D2
  level_accept: 0.75
  eps: 0.005              # D3: disagreement floor, fraction of axis range
  min_readings: 2         # D4
  max_accept_margin: 0.03 # never ACCEPT when the error margin is wider than 3% of the axis range
  max_tool_calls: 8
  alpha: 0.10             # BH target wrong-flag rate
  min_group_size: 200     # D6: smaller calibration groups fall back to coarser ones
  min_group_charts: 20    # a group rests on its charts, not its points: fewer than 20 charts -> coarser group (§24.7)
  batch_check: true
  by_tool_set: false      # U14 (rejected): margins fitted on the exact tools used. Replay: dev wrong flags 1.4 -> 4.1%, margin check 98.8 -> 93.2%.
                          # A pair that stopped early *because it agreed* is a selected sample; the pooled margin is the buffer against that.
  drop_tied_legs: true    # U10: a tool that reads both legs of a difference / relative change as one number gives no reading

retrieval:
  ref_bonus: 10.0         # explicit "Figure N" in the sentence
  min_score: 0.5          # below this -> NO_FIGURE
  vocab_match: 80         # rapidfuzz score for series/x to count as "in this figure"
  legend_names: true      # OCR found no figure: ask the VLM for the legend of near-miss figures (U11b pilot: 5 of 7 wrong
                          # NO_FIGUREs recovered, 0 of 23 right ones invented; one cached call per figure)
  cited_first: false      # v2: a cited "Figure N" that matches all but the (OCR-misread) series beats an uncited figure
  ambiguity_ratio: 0.8    # several figures show the claim: check the top two if the second scores >= ratio x the first
                          # (v2: 0.0 = always check two, because two charts can share a caption, e.g. "Training loss")
  equivalent_metrics: false   # v3 (B9): an error-rate claim may be checked on an accuracy chart (as 100 - accuracy)
  aliases: {}             # v3 (B9): other names of a series, e.g. {RN50: ResNet-50}; used only when no figure shows the name

agent:
  policy: fixed_order     # all_tools | fixed_order | calibration_informed | informed | llm
  fixed_order: [ocr_pixel, deplot, vlm_table, vlm_crop]
  hand_off_rejected: false  # v2: a sentence that looks like a claim but the parser rejects goes to the TA (not dropped)
  check_captions: false   # v3 (A4): sentences in captions are checked against their own figure
  hand_off_unsupported: false  # v3 (B7): claims on charts flagged at ingest (dual y-axes, unsupported kinds) go to the TA
  cross_chart: false      # v3 (B9): a difference whose two values sit on two different figures of the same kind
  ambiguous_rule: both    # two figures fit a sentence: either | top | both | never (see scripts/analysis/ambiguous_rules.py).
                          # Chosen on 14 ambiguous claims (test + dev): either/top accepted 5, one of them wrong; both/never 0 missed errors
  informed:               # the informed policy (agent/planner.py); every number is read from the tool profile
    min_answer: 0.10        # a tool that answers < 10% of the time here would almost surely refuse: skip it
    max_wrong_agree: 0.05   # half the 10% wrong-flag target: a pair that agrees wrongly more often is no cross-check
    min_points: 10          # fewer measurements than this in a situation -> use the pooled ("*") numbers
    min_figures: 5          # ... and fewer charts than this too: points on one chart share their mistakes
    min_pair_agreements: 20 # agreements needed before a pair's wrong-agreement rate is trusted
    min_repair_success: 0.5 # a repair is proposed only if it fixed at least this share of such failures in calibration
    big_error: 0.05         # "badly wrong" = off by more than 5% of the axis range (the usual ChartQA tolerance)
    never_pair: []          # tools that share one model and so are never each other's cross-check, e.g. [[vlm_table, vlm_crop]]

claims:                   # v3 switches (results/run_log.md, section H); all off here, on in configs/exp/v3.yaml
  ranges: false           # A6: "between 85% and 90%" is one claim with two bounds
  split_multi: false      # B2: a sentence with several numbers gives one claim per number
  extremum: false         # B3: "peaks at 91.2% at epoch 14" = the value at 14 + "14 is the highest point"
  unit_convert: false     # A5: a % claim on a 0-1 axis (or a fraction on a 0-100 axis) is compared after converting
  log_values: false       # B4: a point claim on a log-scale axis is compared in log10 units

ingest:                   # v3 switches for reading the PDF (a parse with other settings is cached separately)
  two_column: false       # A7: two-column pages are read column by column; captions matched within their column
  vector_figures: false   # B1: vector drawings above a "Figure N" caption are rendered to an image
  split_panels: false     # B5: a figure with several plot panels becomes one figure per panel (fig3a, fig3b)
  detect_kinds: false     # B7: flag dual y-axes and chart kinds the tools cannot read (scatter, box, heatmap, histogram)
  ocr_scanned: false      # C5: a page with no text layer is OCR'd with Tesseract
  axis_modes: [linear]    # B4: [linear, log, inverted] lets the y-axis fit try a log scale and a downward axis

calibration:
  splits: [calib]
  order: fixed            # a k-reading calibration item uses the first k answering tools in agent.fixed_order ("random": a seeded
                          # random subset). Explicit since 9 Nov; before, it silently followed agent.policy

tools:
  enabled: [ocr_pixel, deplot, vlm_table, vlm_crop]

models:
  vlm: Qwen/Qwen3-VL-4B-Instruct        # D8
  vlm_fallback: Qwen/Qwen2.5-VL-7B-Instruct
  deplot: google/deplot
  lora_adapter: null                    # path after fine-tuning; null = base model
  vlm2: null                            # a second model family for tools vlm2_crop / vlm2_table (run_log section I)
  vlm2_dtype: bfloat16
  remote_url: null                      # model server URL (web/model_server); null = load the models here
  dtype: float16                        # T4 has no bf16
